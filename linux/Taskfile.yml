version: '3'

tasks:
  default:
    cmds:
      - task: setup

  setup:
    desc: Setup dotfiles for Linux (WSL / ネイティブ Ubuntu を選択)
    deps:
      - check-requirements
    cmds:
      - |
        echo "どちらの環境をセットアップしますか?"
        echo "  1) WSL (Windows Subsystem for Linux)"
        echo "  2) Ubuntu (ネイティブ)"
        printf "番号を入力 [1/2]: "
        read -r choice
        case "$choice" in
          1) task link-wsl ;;
          2) task link-ubuntu ;;
          *) echo "❌️ 無効な選択です。1 または 2 を入力してください。"; exit 1 ;;
        esac

  check-requirements:
    desc: Check system requirements
    cmds:
      - |
        if [[ "$(uname -s)" != "Linux" ]]; then
          echo "❌️ This setup is intended for Linux systems only."
          exit 1
        fi
      - |
        if [[ "$SHELL" != *"zsh"* ]]; then
          echo "⚠️ The default shell is not zsh."
          echo "zsh をデフォルトシェルに設定してから再度実行してください。"
          exit 1
        fi
      - |
        if ! command -v stow > /dev/null 2>&1; then
          echo "⚠️ GNU Stow がインストールされていません。先にインストールしてください。"
          exit 1
        fi

  link-wsl:
    desc: Link zsh configuration (WSL)
    dir: wsl
    cmds:
      - stow -t ~ zsh
      - echo "✅ WSL 用の zsh 設定をリンクしました。"

  link-ubuntu:
    desc: Link zsh configuration (ネイティブ Ubuntu)
    dir: ubuntu
    cmds:
      - stow -t ~ zsh
      - echo "✅ Ubuntu 用の zsh 設定をリンクしました。"
