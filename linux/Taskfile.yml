version: '3'

tasks:
  default:
    cmds:
      - task: setup

  setup:
    desc: Setup all dotfiles for Linux
    deps:
      - check-requirements
      - link-zsh
    cmds:
      - echo "✅ Setup completed successfully!"

  check-requirements:
    desc: Check system requirements
    cmds:
      - |
        if [[ "$(uname -s)" != "Linux" ]]; then
          echo "❌️ This setup is intended for Linux systems only."
          exit 1
        fi
      - |
        if [[ "$SHELL" != *"zsh"* ]]; then
          echo "⚠️ The default shell is not zsh."
          echo "zsh をデフォルトシェルに設定してから再度実行してください。"
          exit 1
        fi
      - |
        if ! command -v stow > /dev/null 2>&1; then
          echo "⚠️ GNU Stow がインストールされていません。先にインストールしてください。"
          exit 1
        fi

  link-zsh:
    desc: Link zsh configuration
    cmds:
      - stow -t ~ zsh
